version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dbvendas_user
      POSTGRES_PASSWORD: dbvendas_pass
      POSTGRES_DB: dbvendas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbvendas_user -d dbvendas"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
