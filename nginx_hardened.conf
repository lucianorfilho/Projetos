# ============================================
# Nginx Configuration - Security Hardened
# Copiar para: /etc/nginx/sites-available/dbvendas
# ============================================

# Rate limiting
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;

# ============================================
# SPA vs API: /vendas, /produtos e /usuarios sao ao mesmo tempo rotas do
# React Router e endpoints da API. Sem isso, digitar a URL ou dar F5 em
# /vendas devolvia o JSON {"detail":"Not authenticated"} em vez da tela.
#
# Navegacao do navegador  -> Sec-Fetch-Dest: document  / Accept: text/html
# Chamada do axios/fetch  -> Sec-Fetch-Dest: empty     / Accept: application/json
# ============================================
map $http_accept $aceita_html {
    default      0;
    "~*text/html" 1;
}

map $http_sec_fetch_dest $navegacao_spa {
    default   0;
    document  1;
    ""        $aceita_html;   # navegadores antigos nao mandam Sec-Fetch-Dest
}

# Upstream backend
upstream dbvendas_backend {
    server localhost:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name dbvendas.dbtechsolutions.com.br;

    # ============================================
    # SSL/TLS Configuration
    # ============================================
    ssl_certificate /etc/letsencrypt/live/dbvendas.dbtechsolutions.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dbvendas.dbtechsolutions.com.br/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/dbvendas.dbtechsolutions.com.br/chain.pem;

    # ============================================
    # Security Headers
    # ============================================

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Enable XSS protection
    add_header X-XSS-Protection "1; mode=block" always;

    # Clickjacking protection
    add_header X-Frame-Options "DENY" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS - Strict Transport Security
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Permissions Policy (formerly Feature Policy)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # Remove Server header
    server_tokens off;

    # ============================================
    # Charset
    # ============================================
    charset utf-8;

    # ============================================
    # Gzip Compression
    # ============================================
    gzip on;
    gzip_vary on;
    # application/javascript faltava aqui: o bundle ia cru (250KB) em vez de ~80KB
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json image/svg+xml application/xml+rss;
    gzip_min_length 1000;

    # ============================================
    # Limits
    # ============================================
    # Timeouts curtos demais cortavam o download do bundle em conexoes lentas,
    # deixando um JS truncado em cache no navegador (login parava de funcionar).
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    send_timeout 60s;

    # ============================================
    # Static Assets - MUST be before frontend SPA route!
    # ============================================
    location /assets/ {
        alias /opt/dbvendas/frontend/dist/assets/;
        # Sem "immutable": um download truncado ficava preso no cache do
        # navegador para sempre, sem chance de revalidar.
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location = /vite.svg {
        alias /opt/dbvendas/frontend/dist/vite.svg;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
    }

    # ============================================
    # API Backend - Rate Limited (MUST be before frontend routes!)
    # ============================================

    # Login endpoint - strict rate limit
    location /auth/login {
        limit_req zone=login_limit burst=10 nodelay;
        proxy_pass http://dbvendas_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header Authorization $http_authorization;
    }

    # API endpoints - moderate rate limit (com ou sem / no final)
    location ~ ^/(auth|usuarios|produtos|vendas|pre-vendas|caixa|evento)(/?|/.*)$ {
        # F5 ou URL digitada em /vendas: entregar a SPA, nao o JSON da API.
        if ($navegacao_spa) {
            rewrite ^ /index.html last;
        }

        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://dbvendas_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header Authorization $http_authorization;
    }

    # ============================================
    # Frontend - /opt/dbvendas/frontend/dist
    # ============================================
    location / {
        alias /opt/dbvendas/frontend/dist/;
        try_files $uri /index.html;
        # O index.html nunca pode ser cacheado: ele aponta para o bundle com
        # hash. Cacheado, o navegador fica preso num build antigo para sempre.
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ============================================
    # Cardápio Frontend - /opt/dbvendas/cardapio-frontend/dist
    # ============================================
    location /cardapio {
        alias /opt/dbvendas/cardapio-frontend/dist/;
        try_files $uri /index.html;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }


    # ============================================
    # Deny access to sensitive files
    # ============================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ (\.php|\.phtml|\.pl|\.py|\.jsp|\.asp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # Logging
    # ============================================
    access_log /var/log/nginx/dbvendas_access.log combined;
    error_log /var/log/nginx/dbvendas_error.log warn;
}

# ============================================================
# Cardápio - subdomínio próprio
# Antes dividia o server block com o admin, então a raiz do
# subdomínio caía no frontend administrativo.
# ============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name cardapio.dbvendas.dbtechsolutions.com.br;

    ssl_certificate /etc/letsencrypt/live/dbvendas.dbtechsolutions.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dbvendas.dbtechsolutions.com.br/privkey.pem;

    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    server_tokens off;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json image/svg+xml application/xml+rss;
    gzip_min_length 1000;

    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    send_timeout 60s;

    # Assets com hash no nome
    location /assets/ {
        alias /opt/dbvendas/cardapio-frontend/dist/assets/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Login com limite estrito
    location /auth/login {
        limit_req zone=login_limit burst=10 nodelay;
        proxy_pass http://dbvendas_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header Authorization $http_authorization;
    }

    # API
    location ~ ^/(api|auth|usuarios|produtos|vendas|pre-vendas|caixa|evento)(/?|/.*)$ {
        # Mesma regra do admin: navegacao do navegador recebe a SPA.
        if ($navegacao_spa) {
            rewrite ^ /index.html last;
        }

        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://dbvendas_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header Authorization $http_authorization;
    }

    # SPA do cardápio - index.html nunca cacheado
    location / {
        alias /opt/dbvendas/cardapio-frontend/dist/;
        try_files $uri /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/cardapio_access.log combined;
    error_log /var/log/nginx/cardapio_error.log warn;
}
